<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSVP | Peter & Kelly's Wedding</title>
  <meta name="description" content="Wedding celebration for Peter and Kelly at Chautauqua Harbor Hotel on October 9, 2027." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    :root {
      --ivory: #f7f3eb;
      --warm-white: #fffaf2;
      --sage: #5f6f58;
      --sage-dark: #465541;
      --navy: #16273a;
      --champagne: #d8c6a3;
      --taupe: #b8aa98;
      --charcoal: #2d2e2b;
      --muted: #686864;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--ivory);
      color: var(--charcoal);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }

    .nav {
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7vw;
      background: rgba(255, 250, 242, .96);
      border-bottom: 1px solid rgba(22, 39, 58, .10);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(10px);
    }

    .monogram {
      color: var(--navy);
      font-size: 1.8rem;
      letter-spacing: .16em;
    }

    .nav-links {
      display: flex;
      gap: 2.7vw;
      color: var(--navy);
      font-size: .72rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .hero {
      min-height: 850px;
      position: relative;
      display: grid;
      place-items: center;
      text-align: center;
      color: white;
      background:
        linear-gradient(rgba(10, 16, 22, .22), rgba(10, 16, 22, .42)),
        url("assets/hero.jpg") center/cover no-repeat;
      padding: 92px 24px 58px;
      overflow: hidden;
    }

    .hero-content {
      width: min(920px, 100%);
      margin: 0 auto;
      text-shadow: 0 3px 18px rgba(0,0,0,.42);
    }

    .invitation-names {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin: 0 auto 34px;
    }

    .hero-name {
      font-family:'Great Vibes', cursive;
      font-size: clamp(5.2rem, 10vw, 9.5rem);
      line-height: .9;
      font-weight: 400;
      letter-spacing: .01em;
      text-transform: none;
      white-space: nowrap;
    }

    .hero-name.kelly {
      transform: translateX(9vw);
    }

    .hero-name.peter {
      transform: translateX(-9vw);
    }

    .hero-amp {
      font-family: "Brush Script MT", "Segoe Script", cursive;
      color: var(--champagne);
      font-size: clamp(3rem, 7vw, 6rem);
      line-height: .65;
      text-shadow: 0 3px 14px rgba(0,0,0,.38);
      margin: -4px 0;
    }

    .date {
      display: inline-block;
      margin: 12px 0 10px;
      padding: 12px 34px;
      border-top: 1px solid rgba(255,255,255,.76);
      border-bottom: 1px solid rgba(255,255,255,.76);
      font-size: clamp(1.45rem, 2.4vw, 2.35rem);
      letter-spacing: .24em;
      font-weight: 700;
      text-transform: uppercase;
    }

    .venue {
      margin: 10px 0 30px;
      font-size: .98rem;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .countdown {
      width: min(650px, 94vw);
      margin: 24px auto 0;
      background: rgba(255, 250, 242, .96);
      color: var(--navy);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 2px solid rgba(216, 198, 163, .85);
      box-shadow: 0 14px 30px rgba(0,0,0,.18);
      text-shadow: none;
    }

    .countdown div {
      padding: 22px 18px;
      border-right: 1px solid rgba(184, 170, 152, .55);
    }

    .countdown div:last-child { border-right: none; }

    .countdown strong {
      display: block;
      color: var(--navy);
      font-weight: 400;
      font-size: clamp(1.9rem, 4vw, 3rem);
      line-height: 1;
      letter-spacing: .06em;
    }

    .countdown span {
      display: block;
      margin-top: 8px;
      font-size: .72rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--charcoal);
    }

    .button {
      display: inline-block;
      margin-top: 24px;
      padding: 15px 34px;
      background: var(--sage);
      color: white;
      font-size: .76rem;
      letter-spacing: .17em;
      text-transform: uppercase;
      transition: .2s ease;
      box-shadow: 0 8px 18px rgba(0,0,0,.10);
      text-shadow: none;
    }

    .button:hover {
      background: var(--sage-dark);
      transform: translateY(-1px);
    }

    .section { padding: 92px 8vw; }
    .section-light { background: var(--warm-white); }
    .section-ivory { background: var(--ivory); }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7vw;
      align-items: center;
    }

    .center { text-align: center; }

    .script {
      font-family: "Brush Script MT", "Segoe Script", cursive;
      color: var(--sage);
      font-size: clamp(2.5rem, 5vw, 3.6rem);
      line-height: 1.1;
      font-weight: 400;
      margin: 0 0 8px;
    }

    h2 {
      margin: 0 0 22px;
      color: var(--navy);
      font-size: clamp(1.75rem, 2.7vw, 2.7rem);
      line-height: 1.22;
      letter-spacing: .11em;
      text-transform: uppercase;
      font-weight: 400;
    }

    h3 {
      color: var(--navy);
      font-weight: 400;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    p { font-size: 1.08rem; margin-top: 0; }

    .lede {
      max-width: 700px;
      margin: 0 auto;
      color: var(--muted);
    }

    .framed-photo {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      display: block;
      border: 8px solid var(--ivory);
      outline: 1px solid rgba(70, 85, 65, .34);
      box-shadow: 0 18px 40px rgba(0,0,0,.12);
    }

    .quick-links {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: linear-gradient(90deg, var(--sage-dark), var(--sage));
      color: var(--ivory);
      padding: 46px 8vw;
      text-align: center;
    }

    .quick-card {
      padding: 12px 30px;
      border-right: 1px solid rgba(247,243,235,.42);
    }

    .quick-card:last-child { border-right: 0; }

    .quick-card .icon {
      color: var(--champagne);
      font-size: 2.25rem;
      margin-bottom: 10px;
    }

    .quick-card h3 {
      margin: 0 0 8px;
      color: var(--ivory);
      font-size: .98rem;
      letter-spacing: .15em;
    }

    .quick-card p {
      margin: 0;
      color: rgba(255,250,242,.88);
      font-size: .94rem;
    }

    .yes-pill {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 24px;
      border: 1px solid var(--champagne);
      border-radius: 999px;
      background: var(--warm-white);
      color: var(--sage-dark);
      font-style: italic;
      font-size: 1.15rem;
      box-shadow: 0 6px 14px rgba(0,0,0,.06);
    }

    .timeline-wrap {
      max-width: 980px;
      margin: 54px auto 20px;
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
    }

    .timeline-wrap::before {
      content: "";
      position: absolute;
      top: 34px;
      left: 12%;
      right: 12%;
      height: 2px;
      background: var(--champagne);
      z-index: 0;
    }

    .timeline-item {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 0 10px;
    }

    .timeline-marker {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--sage);
      color: white;
      border: 4px solid var(--ivory);
      box-shadow: 0 0 0 1px var(--champagne), 0 10px 20px rgba(0,0,0,.10);
      font-size:3rem;
    }

    .timeline-item h3 { margin: 0 0 4px; font-size: 1.08rem; }

    .timeline-date {
      color: var(--muted);
      font-size: .88rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .timeline-events {
      background: rgba(255, 250, 242, .68);
      border: 1px solid rgba(184,170,152,.42);
      padding: 20px 18px;
      min-height: 116px;
      box-shadow: 0 12px 24px rgba(0,0,0,.04);
    }

    .timeline-events p { margin: 0; font-size: 1rem; }

    .schedule-note {
      max-width: 900px;
      margin: 38px auto 0;
      text-align: left;
      color: #555;
      font-style: italic;
      font-size: .98rem;
      border-top: 1px solid var(--champagne);
      padding-top: 18px;
    }

    .info-cards {
      margin-top: 30px;
      display: grid;
      gap: 18px;
    }

    .info-card {
      background: var(--warm-white);
      border: 1px solid rgba(184,170,152,.46);
      padding: 28px;
      box-shadow: 0 14px 30px rgba(0,0,0,.055);
    }

    .info-card h3 { margin: 0 0 12px; font-size: 1rem; }

    .map-link {
      display: inline-block;
      margin-top: 8px;
      color: var(--navy);
      border-bottom: 1px solid var(--champagne);
      padding-bottom: 2px;
    }

    .gallery {
      display: grid;
      grid-template-columns: 1.15fr 1.15fr 1fr 1.15fr 1.15fr;
      gap: 4px;
      background: var(--warm-white);
      padding: 4px;
    }

    .gallery img {
      display: block;
      width: 100%;
      height: 190px;
      object-fit: cover;
    }

    .monogram-tile {
      min-height: 190px;
      display: grid;
      place-items: center;
      background: var(--ivory);
      border: 1px solid rgba(184,170,152,.6);
      color: var(--navy);
      font-size: 3rem;
      letter-spacing: .15em;
    }

    .rsvp-box {
      max-width: 720px;
      margin: 0 auto;
      background: var(--warm-white);
      border: 1px solid rgba(184,170,152,.48);
      padding: 42px 34px;
      box-shadow: 0 18px 36px rgba(0,0,0,.06);
    }


    .rsvp-form {
      max-width: 780px;
      margin: 28px auto 0;
      text-align: left;
    }

    .form-row {
      margin-bottom: 22px;
    }

    .form-row label,
    .guest-card legend {
      display: block;
      margin-bottom: 8px;
      color: var(--navy);
      font-size: .82rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .rsvp-form input,
    .rsvp-form select,
    .rsvp-form textarea {
      width: 100%;
      border: 1px solid rgba(184,170,152,.62);
      background: var(--ivory);
      padding: 13px 14px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      color: var(--charcoal);
      outline: none;
    }

    .rsvp-form input:focus,
    .rsvp-form select:focus,
    .rsvp-form textarea:focus {
      border-color: var(--sage);
      box-shadow: 0 0 0 3px rgba(95,111,88,.12);
    }

    .radio-group,
    .checkbox-group {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .radio-group label,
    .checkbox-group label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0;
      text-transform: none;
      font-size: 1rem;
      color: var(--charcoal);
      margin: 0;
    }

    .radio-group input,
    .checkbox-group input {
      width: auto;
    }

    .guest-card {
      border: 1px solid rgba(184,170,152,.46);
      background: rgba(255,250,242,.72);
      padding: 22px;
      margin: 18px 0;
      box-shadow: 0 10px 22px rgba(0,0,0,.035);
    }

    .guest-card h3 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 1rem;
    }

    .guest-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-note {
      color: var(--muted);
      font-size: .95rem;
      margin-top: -6px;
    }

    .rsvp-status {
      margin-top: 18px;
      font-size: 1rem;
      color: var(--navy);
    }

    .submit-button {
      border: none;
      cursor: pointer;
    }

    .rsvp-actions { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:8px; }
    .secondary-button { background:transparent; color:var(--navy); border:1px solid var(--champagne); box-shadow:none; }
    .secondary-button:hover { background:var(--ivory); color:var(--navy); }
    .rsvp-helper { margin-top:10px; color:var(--muted); font-size:.95rem; }

    .rsvp-decision {
      display: none;
      margin: 20px 0 24px;
      padding: 22px;
      background: rgba(255,250,242,.78);
      border: 1px solid rgba(184,170,152,.46);
      text-align: center;
      box-shadow: 0 10px 22px rgba(0,0,0,.035);
    }

    .rsvp-decision p {
      margin-bottom: 16px;
    }



    @media (max-width: 640px) {
      .guest-grid { grid-template-columns: 1fr; }
      .radio-group, .checkbox-group { gap: 10px; }
    }

    .footer {
      background: linear-gradient(90deg, #121212, var(--navy));
      color: var(--ivory);
      text-align: center;
      padding: 54px 24px;
    }

    .footer .script { color: var(--champagne); font-size: 2.3rem; }

    .footer .small {
      letter-spacing: .22em;
      text-transform: uppercase;
      font-size: .9rem;
    }

    @media (max-width: 900px) {
      .nav { padding: 0 5vw; }
      .nav-links { gap: 18px; font-size: .62rem; }
      .hero { min-height: 760px; }
      .hero-name.kelly { transform: translateX(-3vw); }
      .hero-name.peter { transform: translateX(3vw); }
      .split { grid-template-columns: 1fr; }
      .quick-links { grid-template-columns: 1fr 1fr; }
      .quick-card:nth-child(2) { border-right: 0; }
      .quick-card:nth-child(1), .quick-card:nth-child(2) { border-bottom: 1px solid rgba(247,243,235,.42); }
      .timeline-wrap { gap: 16px; }
      .gallery { grid-template-columns: 1fr 1fr; }
      .monogram-tile { order: 6; }
    }

    @media (max-width: 640px) {
      .nav {
        height: auto;
        padding: 18px 20px;
        align-items: flex-start;
      }

      .nav-links {
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px 14px;
        max-width: 270px;
      }

      .hero { min-height: 720px; padding-top: 80px; }
      .hero-name {
        font-size: clamp(4rem, 17vw, 6rem);
        letter-spacing: .09em;
      }
      .hero-name.kelly { transform: translateX(4vw); }
      .hero-name.peter { transform: translateX(-4vw); }

      .date {
        letter-spacing: .15em;
        padding: 10px 20px;
      }

      .countdown { grid-template-columns: repeat(2, 1fr); }
      .countdown div:nth-child(2) { border-right: 0; }
      .countdown div:nth-child(1), .countdown div:nth-child(2) {
        border-bottom: 1px solid rgba(184,170,152,.55);
      }

      .quick-links, .timeline-wrap, .gallery { grid-template-columns: 1fr; }
      .quick-card {
        border-right: 0;
        border-bottom: 1px solid rgba(247,243,235,.42);
      }
      .quick-card:last-child { border-bottom: 0; }
      .timeline-wrap::before { display: none; }
      .timeline-events { min-height: auto; }
      .gallery img { height: 230px; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="monogram" href="index.html">P • K</a>
    <div class="nav-links">
      <a href="index.html">Wedding Website</a>
      <a href="rsvp.html">RSVP</a>
    </div>
  </nav>

  <section class="section section-light center" style="padding:70px 8vw 18px;">
    <div class="script">Peter & Kelly's Wedding</div>
  </section>


  <section class="section section-light center" id="rsvp" style="padding-top:80px;">
    <div class="rsvp-box">
      <h2 id="rsvpPageHeading">RSVP Management</h2>

      <form id="rsvpForm" class="rsvp-form">
        <div class="form-row" id="lookupSection">
          <label for="lookupFirstName">Guest First Name</label>
          <input id="lookupFirstName" type="text" required placeholder="Example: Mary" />

          <label for="lookupLastName" style="margin-top:18px;">Guest Last Name</label>
          <input id="lookupLastName" type="text" required placeholder="Example: Smith" />

          <input id="householdId" type="hidden" />

          <div class="rsvp-actions">
            <button class="button secondary-button" type="button" id="findRsvpButton">Find or Start RSVP</button>
          </div>
          <p class="rsvp-helper">You may search using any guest who was included in a previous RSVP.</p>
        </div>

        <div id="rsvpDecision" class="rsvp-decision"></div>

        <div id="rsvpFields" style="display:none;">
          <div class="form-row">
            <label for="guestCount">Number of people included in this RSVP</label>
            <select id="guestCount" required>
              <option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option>
              <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
            </select>
          </div>

          <div id="guestContainer"></div>

          <button class="button submit-button" id="submitRsvpButton" type="submit">Submit RSVP</button>
        </div>

        <div id="rsvpStatus" class="rsvp-status" aria-live="polite"></div>
      </form>

      <div id="rsvpThankYou" class="rsvp-status" style="display:none;text-align:center;margin-top:20px;">
        <h2 id="rsvpThankYouHeading"></h2>
        <p id="rsvpThankYouMessage"></p>
        <p>If your plans change, simply return to this page anytime to update your RSVP before <strong>August 15, 2027</strong>.</p>
        <p style="margin-top:28px;">
          <a class="button" href="index.html">← Return to the Wedding Website</a>
        </p>
      </div>
    </div>
  </section>



  <script>
    const RSVP_ENDPOINT = "https://script.google.com/macros/s/AKfycbzy1bFZPrv0Nn2fWD2k2cxjA2tSENPgXdR-7YdzhIFMxTY9H3FRaDZx36VMw2VqYZayyg/exec";
    const adultMeals = ["Filet", "Chicken", "Vegetarian"];
    const childMeals = ["Chicken", "Pasta"];

    const lookupFirstNameInput = document.getElementById("lookupFirstName");
    const lookupLastNameInput = document.getElementById("lookupLastName");
    const householdIdInput = document.getElementById("householdId");
    const guestCount = document.getElementById("guestCount");
    const guestContainer = document.getElementById("guestContainer");
    const rsvpForm = document.getElementById("rsvpForm");
    const rsvpStatus = document.getElementById("rsvpStatus");
    const submitButton = document.getElementById("submitRsvpButton");
    const findButton = document.getElementById("findRsvpButton");
    const rsvpFields = document.getElementById("rsvpFields");
    const rsvpDecision = document.getElementById("rsvpDecision");

    let existingRsvpFound = false;
    let foundRsvpData = null;

    function esc(value) {
      return String(value || "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function newHouseholdId() {
      return "hh_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    }

    function mealOptions(type, selected = "") {
      const meals = type === "Child" ? childMeals : adultMeals;
      return meals.map(meal => `<option value="${meal}" ${meal === selected ? "selected" : ""}>${meal}</option>`).join("");
    }

    function showFields() { rsvpFields.style.display = "block"; }
    function hideFields() { rsvpFields.style.display = "none"; }

    function captureCurrentGuests() {
      const guests = [];
      const existingCards = guestContainer.querySelectorAll(".guest-card");

      existingCards.forEach((card, index) => {
        const i = index + 1;
        const status = document.getElementById(`guestStatus${i}`)?.value || "Joyfully Accept";
        guests.push({
          guestNumber: i,
          firstName: document.getElementById(`guestFirstName${i}`)?.value.trim() || "",
          lastName: document.getElementById(`guestLastName${i}`)?.value.trim() || "",
          status,
          type: document.getElementById(`guestType${i}`)?.value || "Adult",
          meal: document.getElementById(`meal${i}`)?.value || "",
          comments: document.getElementById(`comments${i}`)?.value || "",
          rehearsalDinner: document.getElementById(`rehearsalDinner${i}`)?.checked ? "Yes" : "No",
          morningAfterBrunch: document.getElementById(`morningAfterBrunch${i}`)?.checked ? "Yes" : "No"
        });
      });

      return guests;
    }

    function renderGuests(prefill = []) {
      const count = Number(guestCount.value || 1);
      guestContainer.innerHTML = "";

      for (let i = 1; i <= count; i++) {
        const g = prefill[i - 1] || {};
        const type = g.type || "Adult";
        const status = g.status || "Joyfully Accept";
        const firstName = g.firstName || (i === 1 ? lookupFirstNameInput.value.trim() : "");
        const lastName = g.lastName || (i === 1 ? lookupLastNameInput.value.trim() : "");
        const commentsLabel = status === "Regretfully Decline" ? "Other Comments" : "Dietary Restrictions / Other Comments";

        const card = document.createElement("div");
        card.className = "guest-card";
        card.innerHTML = `
          <h3>Guest ${i}</h3>
          <div class="guest-grid">
            <div class="form-row">
              <label for="guestFirstName${i}">Guest First Name</label>
              <input id="guestFirstName${i}" type="text" required value="${esc(firstName)}" />
            </div>

            <div class="form-row">
              <label for="guestLastName${i}">Guest Last Name</label>
              <input id="guestLastName${i}" type="text" required value="${esc(lastName)}" />
            </div>

            <div class="form-row">
              <label for="guestStatus${i}">Attendance</label>
              <select id="guestStatus${i}" required data-status-index="${i}">
                <option value="Joyfully Accept" ${status === "Joyfully Accept" ? "selected" : ""}>Joyfully Accept</option>
                <option value="Regretfully Decline" ${status === "Regretfully Decline" ? "selected" : ""}>Regretfully Decline</option>
              </select>
            </div>

            <div class="form-row" id="typeRow${i}">
              <label for="guestType${i}">Adult or Child</label>
              <select id="guestType${i}" data-index="${i}">
                <option value="Adult" ${type === "Adult" ? "selected" : ""}>Adult</option>
                <option value="Child" ${type === "Child" ? "selected" : ""}>Child</option>
              </select>
            </div>

            <div class="form-row" id="mealRow${i}">
              <label for="meal${i}">Meal Selection</label>
              <select id="meal${i}">${mealOptions(type, g.meal || "")}</select>
            </div>

            <div class="form-row">
              <label for="comments${i}" id="commentsLabel${i}">${commentsLabel}</label>
              <textarea id="comments${i}" rows="3" placeholder="Optional">${g.comments || ""}</textarea>
            </div>

            <div class="form-row" id="additionalEventsRow${i}">
              <label>Additional Events</label>
              <div class="checkbox-group">
                <label><input type="checkbox" id="rehearsalDinner${i}" ${g.rehearsalDinner === "Yes" ? "checked" : ""} /> Attending Rehearsal Dinner</label>
                <label><input type="checkbox" id="morningAfterBrunch${i}" ${g.morningAfterBrunch === "Yes" ? "checked" : ""} /> Attending Morning-After Brunch</label>
              </div>
            </div>
          </div>`;
        guestContainer.appendChild(card);
      }

      document.querySelectorAll("[data-index]").forEach(select => {
        select.addEventListener("change", event => {
          const meal = document.getElementById(`meal${event.target.dataset.index}`);
          if (meal) meal.innerHTML = mealOptions(event.target.value);
        });
      });

      document.querySelectorAll("[data-status-index]").forEach(select => {
        const update = () => {
          const idx = select.dataset.statusIndex;
          const accepting = select.value === "Joyfully Accept";

          const typeRow = document.getElementById(`typeRow${idx}`);
          const mealRow = document.getElementById(`mealRow${idx}`);
          const eventsRow = document.getElementById(`additionalEventsRow${idx}`);
          const type = document.getElementById(`guestType${idx}`);
          const meal = document.getElementById(`meal${idx}`);
          const label = document.getElementById(`commentsLabel${idx}`);
          const rehearsal = document.getElementById(`rehearsalDinner${idx}`);
          const brunch = document.getElementById(`morningAfterBrunch${idx}`);

          if (typeRow) typeRow.style.display = accepting ? "block" : "none";
          if (mealRow) mealRow.style.display = accepting ? "block" : "none";
          if (eventsRow) eventsRow.style.display = accepting ? "block" : "none";
          if (type) type.required = accepting;
          if (meal) meal.required = accepting;
          if (label) label.textContent = accepting ? "Dietary Restrictions / Other Comments" : "Other Comments";

          if (!accepting) {
            if (rehearsal) rehearsal.checked = false;
            if (brunch) brunch.checked = false;
          }
        };
        select.addEventListener("change", update);
        update();
      });
    }

    function resetBlankRsvp() {
      existingRsvpFound = false;
      foundRsvpData = null;
      submitButton.textContent = "Submit RSVP";
      householdIdInput.value = newHouseholdId();
      guestCount.value = "1";
      renderGuests([{
        firstName: lookupFirstNameInput.value.trim(),
        lastName: lookupLastNameInput.value.trim(),
        status: "Joyfully Accept",
        type: "Adult",
        rehearsalDinner: "No",
        morningAfterBrunch: "No"
      }]);
      showFields();
    }

    function prefillForm(data) {
      existingRsvpFound = true;
      submitButton.textContent = "Update RSVP";
      householdIdInput.value = data.householdId || newHouseholdId();

      const guests = data.guests || [];
      guestCount.value = String(data.guestCount || guests.length || 1);
      renderGuests(guests.length ? guests : [{
        firstName: lookupFirstNameInput.value.trim(),
        lastName: lookupLastNameInput.value.trim(),
        status: "Regretfully Decline",
        type: "Adult",
        rehearsalDinner: "No",
        morningAfterBrunch: "No"
      }]);
      showFields();
    }

    function decision(message, buttons) {
      rsvpDecision.style.display = "block";
      rsvpDecision.innerHTML = `<p>${message}</p><div class="rsvp-actions" style="justify-content:center;">${buttons}</div>`;
    }

    window.startNewRsvp = function() {
      rsvpStatus.textContent = "";
      decision("You are starting a new RSVP.", "");
      setTimeout(() => rsvpDecision.style.display = "none", 1200);
      resetBlankRsvp();
    };

    window.useFoundRsvp = function() {
      rsvpStatus.textContent = "";
      rsvpDecision.style.display = "none";
      prefillForm(foundRsvpData);
    };

    function collectPayload() {
      const count = Number(guestCount.value || 0);
      const guests = [];

      for (let i = 1; i <= count; i++) {
        const status = document.getElementById(`guestStatus${i}`)?.value || "Joyfully Accept";
        const accepting = status === "Joyfully Accept";

        guests.push({
          guestNumber: i,
          firstName: document.getElementById(`guestFirstName${i}`)?.value.trim() || "",
          lastName: document.getElementById(`guestLastName${i}`)?.value.trim() || "",
          status,
          type: accepting ? (document.getElementById(`guestType${i}`)?.value || "") : "",
          meal: accepting ? (document.getElementById(`meal${i}`)?.value || "") : "",
          comments: document.getElementById(`comments${i}`)?.value || "",
          rehearsalDinner: accepting && document.getElementById(`rehearsalDinner${i}`)?.checked ? "Yes" : "No",
          morningAfterBrunch: accepting && document.getElementById(`morningAfterBrunch${i}`)?.checked ? "Yes" : "No"
        });
      }

      return {
        submittedAt: new Date().toISOString(),
        householdId: householdIdInput.value || newHouseholdId(),
        lookupFirstName: lookupFirstNameInput.value.trim(),
        lookupLastName: lookupLastNameInput.value.trim(),
        guestCount: guests.length,
        guests
      };
    }

    window.handleRsvpLookup = function(response) {
      if (!response || response.result !== "success") {
        rsvpStatus.textContent = "We could not look up that RSVP right now. Please try again.";
        return;
      }

      if (!response.found) {
        rsvpStatus.textContent = "";
        decision(
          "We did not find an existing RSVP for that first and last name. You can start a new RSVP now.",
          `<button class="button" type="button" onclick="startNewRsvp()">Start New RSVP</button>`
        );
        hideFields();
        return;
      }

      foundRsvpData = response.data;
      const names = (response.data.guests || []).map(g => `${g.firstName} ${g.lastName}`).join(", ");
      rsvpStatus.textContent = "";
      decision(
        `We found an RSVP that includes <strong>${esc(names || "this group")}</strong>. Is this the correct RSVP?`,
        `<button class="button" type="button" onclick="useFoundRsvp()">Yes, update this RSVP</button>
         <button class="button secondary-button" type="button" onclick="startNewRsvp()">Start a new RSVP</button>`
      );
      hideFields();
    };

    function lookupRsvp() {
      const first = lookupFirstNameInput.value.trim();
      const last = lookupLastNameInput.value.trim();

      if (!first || !last) {
        rsvpStatus.textContent = "Please enter both a first name and last name.";
        return;
      }

      hideFields();
      rsvpDecision.style.display = "none";
      rsvpStatus.textContent = "Looking up your RSVP...";

      const script = document.createElement("script");
      script.src = `${RSVP_ENDPOINT}?action=lookup&firstName=${encodeURIComponent(first)}&lastName=${encodeURIComponent(last)}&callback=handleRsvpLookup`;
      script.onerror = () => rsvpStatus.textContent = "We could not connect to the RSVP lookup. Please try again.";
      document.body.appendChild(script);
      setTimeout(() => script.remove(), 10000);
    }

    guestCount?.addEventListener("change", () => {
      const currentGuests = captureCurrentGuests();
      renderGuests(currentGuests);
    });
    renderGuests();
    hideFields();

    findButton?.addEventListener("click", lookupRsvp);

    rsvpForm?.addEventListener("submit", async (event) => {
      event.preventDefault();
      const payload = collectPayload();

      if (!payload.lookupFirstName || !payload.lookupLastName) {
        rsvpStatus.textContent = "Please enter both a first name and last name.";
        return;
      }

      const missingNames = payload.guests.some(g => !g.firstName || !g.lastName);
      if (missingNames) {
        rsvpStatus.textContent = "Please enter a first and last name for each guest.";
        return;
      }

      rsvpStatus.textContent = existingRsvpFound ? "Updating your RSVP..." : "Submitting your RSVP...";

      try {
        await fetch(RSVP_ENDPOINT, {
          method: "POST",
          mode: "no-cors",
          body: new URLSearchParams({ payload: JSON.stringify(payload) })
        });

        rsvpForm.style.display = "none";

        const pageHeading = document.getElementById("rsvpPageHeading");
        if (pageHeading) pageHeading.style.display = "none";

        const anyAccepted = payload.guests.some(
          guest => guest.status === "Joyfully Accept"
        );

        const thankYouHeading = document.getElementById("rsvpThankYouHeading");
        const thankYouMessage = document.getElementById("rsvpThankYouMessage");

        if (anyAccepted) {
          if (thankYouHeading) thankYouHeading.textContent = "Thank You!";
          if (thankYouMessage) {
            thankYouMessage.textContent = "We're looking forward to celebrating with you!";
          }
        } else {
          if (thankYouHeading) thankYouHeading.textContent = "Thank You!";
          if (thankYouMessage) {
            thankYouMessage.textContent = "We're sorry you won't be able to join us, but we truly appreciate you letting us know.";
          }
        }

        const thankYou = document.getElementById("rsvpThankYou");
        if (thankYou) thankYou.style.display = "block";
        rsvpStatus.textContent = "";
      } catch (error) {
        rsvpStatus.textContent = "Something went wrong. Please try again or contact Peter and Kelly.";
      }
    });
  </script>

</body>
</html>
