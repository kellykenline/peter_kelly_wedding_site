<!doctype html><html lang="en"><head><meta name="referrer" content="no-referrer"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSVP | Peter & Kelly's Wedding</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet"><style>
:root{--ivory:#f7f3eb;--warm-white:#fffaf2;--sage:#5f6f58;--sage-dark:#465541;--navy:#16273a;--champagne:#d8c6a3;--taupe:#b8aa98;--charcoal:#2d2e2b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--ivory);color:var(--charcoal);font-family:Georgia,"Times New Roman",serif;line-height:1.6}
a{color:inherit;text-decoration:none}.nav{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 7vw;background:rgba(255,250,242,.97);border-bottom:1px solid rgba(22,39,58,.12)}.monogram{color:var(--navy);font-size:1.8rem;letter-spacing:.16em}.nav-links{display:flex;gap:26px;color:var(--navy);font-size:.75rem;letter-spacing:.16em;text-transform:uppercase}
.hero{position:relative;min-height:320px;display:grid;place-items:center;text-align:center;color:white;padding:58px 20px;background:linear-gradient(rgba(10,16,22,.28),rgba(10,16,22,.48)),url('assets/hero.jpg') center 45%/cover no-repeat}.script{font-family:'Great Vibes',cursive;font-size:clamp(3.3rem,8vw,6rem);line-height:1.15;font-weight:400;margin:0}.hero p{letter-spacing:.17em;text-transform:uppercase;font-size:.84rem;margin:12px 0}
main{width:min(780px,100%);padding:50px 22px 85px;margin:auto}.intro{text-align:center;color:var(--sage);font-family:'Cormorant Garamond',Georgia,serif;font-size:2.1rem;margin:0 0 12px}.help{text-align:center;color:#686864;font-size:1rem;margin:0 0 28px}form{background:var(--warm-white);border:1px solid rgba(184,170,152,.55);padding:32px;margin:22px 0;box-shadow:0 14px 30px rgba(0,0,0,.05)}.guest{padding:24px;background:var(--ivory);border:1px solid rgba(184,170,152,.5);margin:20px 0}.guest h2,#family{font-size:1.2rem;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);overflow-wrap:anywhere}.guest h2{margin:0 0 15px}label{display:block;color:var(--navy);font-size:.88rem;letter-spacing:.04em;margin:16px 0 5px}input,select,textarea{display:block;width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--taupe);background:#fff;font:16px Georgia,serif;color:var(--charcoal);border-radius:2px}textarea{min-height:110px;resize:vertical}button{background:var(--sage);color:white;border:0;cursor:pointer;padding:15px 24px;min-height:50px;letter-spacing:.1em;text-transform:uppercase;font:14px Georgia,serif;margin-top:22px;width:100%}button:hover{background:var(--sage-dark)}button:disabled{opacity:.55;cursor:wait}.hidden{display:none!important}.status{min-height:28px;text-align:center;color:var(--navy);overflow-wrap:anywhere}small{color:#686864}.form-note{text-align:center;margin:16px 0 0}.footer{background:linear-gradient(90deg,#121212,var(--navy));color:var(--ivory);text-align:center;padding:40px 20px}.footer .script{font-size:2.7rem;color:var(--champagne)}
:focus-visible{outline:3px solid #b08d57;outline-offset:3px}@media(max-width:600px){.nav{padding:14px 18px;height:auto;gap:14px}.nav-links{gap:12px;font-size:.67rem;letter-spacing:.08em}.monogram{font-size:1.35rem}.hero{min-height:235px;padding:35px 12px}.hero p{font-size:.72rem}main{padding:30px 14px 65px}form{padding:21px 16px;margin:15px 0}.guest{padding:18px 14px}.intro{font-size:1.8rem}button{min-height:54px}input,select,textarea{font-size:16px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* Brunch invitation: distinct heading, understated supporting copy */
label.brunch-choice{font-size:1.04rem;font-weight:400;letter-spacing:.01em;margin-top:22px}label.brunch-choice .brunch-description{display:block;font-size:.86rem;line-height:1.55;font-weight:400;letter-spacing:0;color:#77736e;margin:7px 0 11px}
</style></head><body><nav class="nav"><a class="monogram" href="index.html">P • K</a><div class="nav-links"><a href="index.html">Wedding Website</a><a href="rsvp.html">RSVP</a></div></nav><main><h2 class="intro">RSVP to Kelly &amp; Peter's Wedding</h2><form id="lookup"><label for="code">Enter your household RSVP code or scan the QR code instead</label><input id="code" required maxlength="40" autocomplete="off" autocapitalize="characters" ><button id="find" type="submit">RSVP</button></form><div id="status" class="status" role="status" aria-live="polite"></div><form id="answers" class="hidden"><h2 id="family"></h2><div id="guests"></div><label for="comments">Household comments (optional)</label><textarea id="comments" maxlength="2000"></textarea><button id="save" type="submit">Save Our RSVP</button><div id="saveStatus" class="status" role="status" aria-live="polite"></div></form></main><footer class="footer"><div class="script">Peter & Kelly</div><p>October 9, 2027 · Chautauqua Lake</p></footer><script>
// Existing deployed Google Apps Script Web App URL.
const API_URL='https://script.google.com/macros/s/AKfycbzM8bFPQ3sAyQjKPqExUkCjkbrumLEFNdnsTS7s5WMZQMfHSo4T1lWlhUsh3yo3RO-pbg/exec';
const $=id=>document.getElementById(id);let household=null;
function status(s){$('status').textContent=s;const near=$('saveStatus');if(near)near.textContent=$('answers').classList.contains('hidden')?'':s}function choice(label,values,value){const wrap=document.createElement('label');wrap.textContent=label;const sel=document.createElement('select');values.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;sel.append(o)});sel.value=value||'';wrap.append(sel);return [wrap,sel]}
function draw(data){household=data;$('guests').replaceChildren();$('family').textContent=data.label||'Your Household';$('comments').value=data.comments||'';data.guests.forEach(g=>{const card=document.createElement('div');card.className='guest';const title=document.createElement('h2');title.textContent=g.firstName+' '+g.lastName;card.append(title);const [a,attendance]=choice('Will this guest attend?',[['','Please select'],['Yes','Joyfully accepts'],['No','Regretfully declines']],g.attending);const [m,meal]=choice('Meal selection',[['','Please select'],...(g.child?[['Chicken Fingers','Chicken fingers'],['Pasta','Pasta']]:[['Filet','Filet'],['Chicken','Chicken'],['Vegetarian','Vegetarian']])],g.meal);const [b,brunch]=choice('Sunday Morning Brunch at Harbor Hotel',[['','Please select'],['Yes','Yes'],['No','No']],g.brunch);b.classList.add('brunch-choice');const brunchInfo=document.createElement('span');brunchInfo.className='brunch-description';brunchInfo.textContent='Join us for brunch the morning after our wedding. Stop by anytime between 9:30 and 11:30 AM.';b.insertBefore(brunchInfo,brunch);card.append(a,m,b);function toggle(){const yes=attendance.value==='Yes';m.classList.toggle('hidden',!yes);b.classList.toggle('hidden',!yes);if(!yes){meal.value='';brunch.value=''}}attendance.addEventListener('change',toggle);toggle();g._controls={attendance,meal,brunch};$('guests').append(card)});$('answers').classList.remove('hidden');$('lookup').classList.add('hidden');$('status').classList.add('hidden');$('answers').scrollIntoView({block:'start',behavior:'smooth'})}
async function request(payload){if(!API_URL.startsWith('https://script.google.com/macros/s/'))throw Error('The RSVP service has not been configured yet.');const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});if(!r.ok)throw Error('Unable to contact the RSVP service.');const d=await r.json();if(!d.ok)throw Error(d.error||'RSVP request failed');return d}
$('lookup').addEventListener('submit',async e=>{e.preventDefault();$('answers').classList.add('hidden');$('lookup').classList.remove('hidden');$('status').classList.remove('hidden');$('find').disabled=true;status('Finding your household…');try{const code=$('code').value.trim().toUpperCase();const d=await request({action:'lookup',code});draw(d);status('Please complete a response for each guest.')}catch(err){status(err.message)}finally{$('find').disabled=false}});
$('answers').addEventListener('submit',async e=>{e.preventDefault();const guests=household.guests.map(g=>({row:g.row,attending:g._controls.attendance.value,meal:g._controls.meal.value,brunch:g._controls.brunch.value}));for(const g of guests){if(!g.attending||(g.attending==='Yes'&&(!g.meal||!g.brunch))){status('Please complete attendance, meal, and brunch choices for each attending guest.');$('saveStatus').scrollIntoView({block:'center',behavior:'smooth'});return}}$('save').disabled=true;status('Saving your RSVP…');$('saveStatus').scrollIntoView({block:'center',behavior:'smooth'});try{const d=await request({action:'save',code:$('code').value.trim().toUpperCase(),guests,comments:$('comments').value});$('answers').classList.add('hidden');$('status').classList.remove('hidden');status('Your RSVP has been saved! You can return anytime with this same code.');$('status').scrollIntoView({block:'center',behavior:'smooth'})}catch(err){status('Unable to save: '+err.message);$('saveStatus').scrollIntoView({block:'center',behavior:'smooth'})}finally{$('save').disabled=false}});
const param=new URLSearchParams(location.search).get('code');
if (param) { try { history.replaceState(null, '', location.pathname); } catch (_) {} }if(param){$('code').value=param; $('lookup').requestSubmit()}
</script></body></html>
